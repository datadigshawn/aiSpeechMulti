name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system audio deps (ffmpeg, portaudio)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg portaudio19-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # 只裝測試所需子集，避免 PyTorch / Whisper 等 GB 級套件拖慢 CI。
          # 真正的 prod 安裝照 README 來。
          pip install \
            pytest pytest-cov \
            jiwer python-Levenshtein \
            cn2an opencc-python-reimplemented \
            python-dotenv

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML (for future Codecov / inspection)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
