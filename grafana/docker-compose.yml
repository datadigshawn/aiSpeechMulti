version: "3.8"

# ============================================================
# aiSpeechMulti Grafana 監控面板
# 使用方式：
#   cd grafana
#   docker compose up -d
#   瀏覽器開啟 http://localhost:3000
#   帳號 admin / 密碼 aiSpeech2026
# ============================================================

services:
  grafana:
    image: grafana/grafana:latest
    container_name: aiSpeechMulti-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=aiSpeech2026
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/aiSpeechMulti.json
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - TZ=Asia/Taipei
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      # 掛載整個 data 目錄（SQLite 需要在同目錄建立 -wal / -shm journal 檔）
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  grafana_data:
    name: aiSpeechMulti_grafana_data
