<!doctype html>
<html lang="zh-Hant" data-theme="dark-cool">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aiSpeechMulti — 監控 Monitor</title>
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
<script src="/static/js/theme-switcher.js"></script>
<style>
  body { background: var(--neutral-1); }
  .page { padding: var(--space-5) var(--space-6); max-width: 1600px; margin: 0 auto; }

  .page__head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-4);
    gap: var(--space-5);
    flex-wrap: wrap;
  }
  .page__head h1 { font-size: var(--fs-h2); }
  .crumb {
    color: var(--neutral-9);
    font-family: var(--font-mono);
    font-size: var(--fs-small);
  }

  .controls {
    display: flex;
    gap: var(--space-2);
    align-items: center;
    flex-wrap: wrap;
  }
  .api-input {
    height: 28px;
    padding: 0 var(--space-3);
    background: var(--neutral-1);
    border: 1px solid var(--neutral-6);
    color: var(--neutral-12);
    font-family: var(--font-mono);
    font-size: var(--fs-small);
    border-radius: var(--radius-2);
    width: 220px;
  }
  .api-input:focus {
    outline: none;
    border-color: var(--brand-primary);
    box-shadow: var(--shadow-focus);
  }

  /* ---------- Lanes (6 channels) ---------- */
  .lanes {
    display: grid;
    grid-template-columns: 220px 1fr 110px;
    gap: 0;
    border: var(--border-thin);
    border-radius: var(--radius-3);
    overflow: hidden;
    background: var(--neutral-2);
  }
  .lane { display: contents; }
  .lane__head {
    padding: var(--space-3) var(--space-4);
    display: flex;
    align-items: center;
    gap: var(--space-3);
    border-bottom: var(--border-thin);
    border-right: var(--border-thin);
    background: var(--neutral-2);
    position: sticky;
    left: 0;
  }
  .lane__num {
    font-family: var(--font-mono);
    font-size: var(--fs-h3);
    font-weight: var(--fw-semibold);
  }
  .lane__name { font-weight: var(--fw-medium); }
  .lane__meta {
    font-size: var(--fs-caption);
    color: var(--neutral-9);
    font-family: var(--font-mono);
  }
  .lane__feed {
    border-bottom: var(--border-thin);
    padding: var(--space-2) 0;
    min-height: 110px;
    max-height: 180px;
    overflow-y: auto;
  }
  .lane__feed--empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--neutral-8);
    font-size: var(--fs-small);
  }
  .lane__stats {
    padding: var(--space-3) var(--space-4);
    border-bottom: var(--border-thin);
    border-left: var(--border-thin);
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: flex-end;
    font-family: var(--font-mono);
    font-size: var(--fs-small);
  }
  .lane[data-last="true"] .lane__head,
  .lane[data-last="true"] .lane__feed,
  .lane[data-last="true"] .lane__stats { border-bottom: none; }

  .header-row { display: contents; }
  .header-row > div {
    padding: var(--space-2) var(--space-4);
    border-bottom: var(--border-thin);
    background: var(--neutral-3);
    font-size: var(--fs-caption);
    letter-spacing: var(--ls-wider);
    text-transform: uppercase;
    color: var(--neutral-9);
  }

  .ch-color-1 { color: var(--ch-1); }
  .ch-color-2 { color: var(--ch-2); }
  .ch-color-3 { color: var(--ch-3); }
  .ch-color-4 { color: var(--ch-4); }
  .ch-color-5 { color: var(--ch-5); }
  .ch-color-6 { color: var(--brand-primary); }

  .transcript {
    display: grid;
    grid-template-columns: 64px 1fr 48px;
    gap: var(--space-3);
    padding: 4px var(--space-4);
    font-size: var(--fs-body);
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  }
  .transcript:last-child { border-bottom: none; }
  .transcript--hazard { background: var(--danger-bg); }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-4);
    margin-top: var(--space-5);
  }

  .api-down-banner {
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-3);
    margin-bottom: var(--space-4);
    font-size: var(--fs-small);
    display: none;
  }
  .api-down-banner.is-visible { display: block; }

  /* Skip-to-content（給螢幕閱讀器使用者）*/
  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    background: var(--brand-primary);
    color: var(--neutral-0);
    padding: 8px 16px;
    z-index: 9999;
    border-radius: 0 0 var(--radius-2) 0;
    text-decoration: none;
    font-weight: var(--fw-semibold);
  }
  .skip-link:focus { left: 0; outline: none; }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">跳至 5 路即時辨識</a>
<div class="page">

  <header class="page__head" role="banner">
    <div>
      <span class="crumb">主控台 / 監控</span>
      <h1 style="margin-top: var(--space-1)">監控 Monitor</h1>
    </div>
    <div class="controls">
      <span class="upper-label">API</span>
      <input type="text" id="apiBase" class="api-input" value="http://localhost:8000" aria-label="FastAPI Base URL">
      <span id="apiStatus" class="badge badge--success badge--dot" aria-live="polite">—</span>
      <button class="btn btn--ghost btn--sm" id="btn-clear" type="button">清除顯示</button>
      <button data-theme-toggle class="btn btn--ghost btn--sm" aria-label="切換主題">
        <span data-theme-icon>🌙</span>
        <span data-theme-label>深冷</span>
      </button>
    </div>
  </header>

  <div id="apiDownBanner" class="api-down-banner" role="alert">
    無法連線到 FastAPI <code>:8000</code>。請確認服務已啟動：<code>python app_api.py</code>
  </div>

  <main id="main-content" class="lanes" role="region" aria-label="6 路即時辨識通道">

    <div class="header-row">
      <div>Channel</div>
      <div>即時辨識 · 危害關鍵字反白 · 信心度 right</div>
      <div style="text-align: right">CER · Rate</div>
    </div>

    <!-- Lanes 由 JS 動態建立 -->
    <div id="lanes-container" style="display: contents"></div>

  </main>

  <div class="stats-row" role="region" aria-label="即時統計">
    <div class="card stat">
      <span class="stat__label">活躍通道</span>
      <span class="stat__value" id="sActive">—</span>
      <span class="stat__delta">/ 6 路總數</span>
    </div>
    <div class="card stat">
      <span class="stat__label">本次顯示筆數</span>
      <span class="stat__value" id="sTx">0</span>
      <span class="stat__delta">最多保留 200 行</span>
    </div>
    <div class="card stat">
      <span class="stat__label">輪詢間隔</span>
      <span class="stat__value">2<span class="stat__unit">s</span></span>
      <span class="stat__delta">/api/channels + /api/transcripts</span>
    </div>
    <div class="card stat">
      <span class="stat__label">最新辨識時間</span>
      <span class="stat__value" id="sLatest" style="font-size: var(--fs-stat-md)">—</span>
      <span class="stat__delta" id="sLatestDelta">—</span>
    </div>
  </div>

  <div style="margin-top: var(--space-6); display: flex; justify-content: space-between; color: var(--neutral-9); font-size: var(--fs-small); font-family: var(--font-mono);">
    <span>aiSpeechMulti / monitor</span>
    <span>
      <a href="/" style="color: var(--neutral-10)">← Landing</a> ·
      <a href="/capture" style="color: var(--neutral-10)">擷取</a> ·
      <a href="/display" style="color: var(--neutral-10)">大螢幕</a> ·
      <a href="/api/health" style="color: var(--neutral-10)">健康檢查</a>
    </span>
  </div>

</div>

<script>
// ============================================================================
// 設定
// ============================================================================
const CHANNEL_IDS   = ['ch1', 'ch2', 'ch3', 'ch4', 'ch5', 'ch6'];
const SEAT_LABELS   = { ch1: 'CC', ch2: 'MTC', ch3: 'DTC', ch4: 'PC', ch5: 'EC', ch6: 'IA' };
const SEAT_FULL     = {
  ch1: '行控中心 (CC)',
  ch2: '主控台 (MTC)',
  ch3: '備援台 (DTC)',
  ch4: '司機員 (PC)',
  ch5: '緊急 (EC)',
  ch6: '事件 (IA)',
};
const POLL_INTERVAL = 2000;
const FEED_MAX_ROWS = 30;       // 每 lane 保留筆數
const TOTAL_MAX     = 200;      // 全頁累計上限

// ============================================================================
// 狀態
// ============================================================================
let lastTxId   = 0;
let totalShown = 0;

// ============================================================================
// 初始化 lanes
// ============================================================================
function initLanes() {
  const container = document.getElementById('lanes-container');
  CHANNEL_IDS.forEach((id, i) => {
    const idx = i + 1;
    const colorClass = idx <= 5 ? `ch-color-${idx}` : 'ch-color-6';
    const badgeClass = idx <= 5 ? `badge--ch${idx}` : '';
    const isLast = i === CHANNEL_IDS.length - 1;

    const lane = document.createElement('div');
    lane.className = 'lane';
    if (isLast) lane.setAttribute('data-last', 'true');
    lane.innerHTML = `
      <div class="lane__head">
        <span class="lane__num ${colorClass}">${String(idx).padStart(2, '0')}</span>
        <div>
          <div class="lane__name">${SEAT_FULL[id]}</div>
          <div class="lane__meta" id="meta-${id}">等待連線…</div>
        </div>
        <span class="badge ${badgeClass} badge--dot" id="status-${id}" style="margin-left: auto">Standby</span>
      </div>
      <div class="lane__feed lane__feed--empty" id="feed-${id}" role="log" aria-label="${SEAT_FULL[id]} 即時辨識">
        — no signal —
      </div>
      <div class="lane__stats" id="stats-${id}">
        <span class="text-muted">— —</span>
        <span class="text-muted">0 / min</span>
      </div>
    `;
    container.appendChild(lane);
  });
}

// ============================================================================
// 輪詢 /api/channels — 更新 lane head + stats
// ============================================================================
async function pollChannels() {
  const base  = document.getElementById('apiBase').value.replace(/\/$/, '');
  const badge = document.getElementById('apiStatus');
  const banner = document.getElementById('apiDownBanner');

  try {
    const res  = await fetch(`${base}/api/channels`, { signal: AbortSignal.timeout(3000) });
    const data = await res.json();

    badge.textContent = 'LIVE';
    badge.className   = 'badge badge--success badge--dot';
    banner.classList.remove('is-visible');

    document.getElementById('sActive').textContent = data.active_channels || 0;

    CHANNEL_IDS.forEach((id, i) => {
      const idx = i + 1;
      const info = (data.channels || []).find(c => c.id === id);
      const meta   = document.getElementById('meta-'   + id);
      const status = document.getElementById('status-' + id);

      if (info) {
        const backend    = info.stt_backend  || 'google';
        const streamMode = info.stream_mode  || 'batch';
        meta.textContent = `${backend} · ${streamMode}`;
        status.textContent = 'Live';
        const cls = idx <= 5 ? `ch${idx}` : '';
        status.className = `badge badge--${cls || 'success'} badge--dot`;
      } else {
        meta.textContent = '等待連線…';
        status.textContent = 'Standby';
        status.className = 'badge badge--dot';
        status.style.opacity = '0.55';
      }
    });
  } catch (_) {
    badge.textContent = 'OFFLINE';
    badge.className   = 'badge badge--danger badge--dot';
    banner.classList.add('is-visible');
    document.getElementById('sActive').textContent = '—';
  }
}

// ============================================================================
// 輪詢 /api/transcripts — 把新辨識結果分派到對應 lane feed
// ============================================================================
async function pollTranscripts() {
  const base = document.getElementById('apiBase').value.replace(/\/$/, '');
  try {
    const res  = await fetch(`${base}/api/transcripts?limit=50`, { signal: AbortSignal.timeout(3000) });
    const data = await res.json();

    const newRows = (data.transcripts || []).filter(t => t.id > lastTxId).reverse();
    if (newRows.length === 0) return;

    newRows.forEach(t => {
      const feed = document.getElementById('feed-' + t.channel_id);
      if (!feed) return;

      // 第一次寫入 → 移除 empty 提示
      if (feed.classList.contains('lane__feed--empty')) {
        feed.classList.remove('lane__feed--empty');
        feed.textContent = '';
      }

      const row = document.createElement('div');
      row.className = 'transcript';

      // 時間
      const dt = new Date(t.created_at);
      const timeStr = dt.toTimeString().slice(0, 8);

      // 信心度
      const conf = t.confidence > 0 ? t.confidence : null;
      const confStr = conf !== null ? conf.toFixed(2) : '—';
      const confClass = conf !== null && conf < 0.7 ? 'transcript__confidence--low' : '';

      // partial vs committed (用 confidence 與 t.is_partial 推測)
      const isPartial = (t.is_partial === true) || (conf !== null && conf < 0.5);

      // 危害關鍵字 highlight（簡單：若文字包含危害級關鍵字則整行加 hazard 樣式）
      const HAZARD_WORDS = ['緊急', '煙霧', '事故', '出軌', '爆炸', '火災', '傷亡'];
      const hasHazard = HAZARD_WORDS.some(w => t.transcript.includes(w));
      if (hasHazard) row.classList.add('transcript--hazard');

      let textHtml = escHtml(t.transcript);
      if (hasHazard) {
        HAZARD_WORDS.forEach(w => {
          textHtml = textHtml.replace(new RegExp(w, 'g'), `<mark class="hazard">${w}</mark>`);
        });
      }

      row.innerHTML = `
        <span class="transcript__time mono">${timeStr}</span>
        <span class="transcript__text ${isPartial ? 'transcript__text--partial' : ''}">${textHtml}</span>
        <span class="transcript__confidence ${confClass}">${confStr}</span>
      `;

      // prepend (最新在最上)
      feed.insertBefore(row, feed.firstChild);
      lastTxId = Math.max(lastTxId, t.id);
      totalShown++;

      // 每 lane trim 至 FEED_MAX_ROWS
      const rows = feed.querySelectorAll('.transcript');
      if (rows.length > FEED_MAX_ROWS) {
        for (let j = FEED_MAX_ROWS; j < rows.length; j++) rows[j].remove();
      }
    });

    // 更新底部 stats
    const sTx = document.getElementById('sTx');
    sTx.textContent = Math.min(totalShown, TOTAL_MAX);

    if (newRows.length > 0) {
      const latest = newRows[newRows.length - 1];
      const dt = new Date(latest.created_at);
      document.getElementById('sLatest').textContent = dt.toTimeString().slice(0, 8);
      document.getElementById('sLatestDelta').textContent = `ch ${latest.channel_id} · ${latest.stt_backend || 'google'}`;
    }

  } catch (_) { /* 靜默失敗，等下次輪詢 */ }
}

// ============================================================================
// 清除顯示
// ============================================================================
function clearFeed() {
  CHANNEL_IDS.forEach(id => {
    const feed = document.getElementById('feed-' + id);
    feed.innerHTML = '— no signal —';
    feed.classList.add('lane__feed--empty');
  });
  totalShown = 0;
  document.getElementById('sTx').textContent = '0';
  document.getElementById('sLatest').textContent = '—';
  document.getElementById('sLatestDelta').textContent = '—';
}

// ============================================================================
// 工具
// ============================================================================
function escHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============================================================================
// 啟動
// ============================================================================
document.getElementById('btn-clear').addEventListener('click', clearFeed);
initLanes();
pollChannels();
pollTranscripts();
setInterval(() => { pollChannels(); pollTranscripts(); }, POLL_INTERVAL);
</script>
</body>
</html>
